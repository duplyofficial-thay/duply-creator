# duple_config.yaml — Fill this in and send to the Duply team to request provisioning.
# Do NOT include LINE tokens here — send those separately via a secure channel.

# ──────────────────────────────────────────────────────────
# 1. Identity
# ──────────────────────────────────────────────────────────

duple_id: ""            # Lowercase, no spaces, globally unique (e.g. grace, leo, khun)
                        # Becomes your DB schema: {duple_id}_ai
                        # Also the LINE mention keyword: @{Duple_id}

archetype: ""           # finance | lifestyle | commerce
                        # finance   = stock tools, watchlist, price alerts
                        # lifestyle = search, calendar, general AI
                        # commerce  = coming soon

# ──────────────────────────────────────────────────────────
# 2. Persona
# ──────────────────────────────────────────────────────────

persona:
  name: ""              # Display name users will see (e.g. Grace)
  language: ""          # th | en | th+en
  description: |
    # 2–4 sentences describing this Duple's personality and purpose.
    # This seeds the initial chat.reply prompt. You'll refine it in Step 2.
    # Example: "Grace is a concise lifestyle assistant. She helps manage
    # schedules, tasks, and day-to-day decisions. She replies in Thai,
    # keeps answers short, and never over-explains."

# ──────────────────────────────────────────────────────────
# 3. Reach / Alerts
# ──────────────────────────────────────────────────────────

reach:
  # Which trigger types this Duple supports.
  # Remove this section entirely if archetype is not finance.
  enabled_triggers:
    - price_above       # Alert when a stock price rises above a target
    - price_below       # Alert when a stock price falls below a target

# ──────────────────────────────────────────────────────────
# 4. Access Gates (who can use each domain during beta)
# ──────────────────────────────────────────────────────────

gates:
  chat: "all"           # all | creator | tester | pro
  reach: "creator"      # Recommended: start with "creator", expand after testing
  memory: "all"
  knowledge: "all"

# ──────────────────────────────────────────────────────────
# 5. LINE OA (send separately — not in this file)
# ──────────────────────────────────────────────────────────

# LINE_CHANNEL_ACCESS_TOKEN — from LINE Developers console
# LINE_CHANNEL_SECRET       — from LINE Developers console
#
# Send both to the Duply team via a secure channel (not email, not git).
# The team will place them in duples/{duple_id}/.env on the Pi.
