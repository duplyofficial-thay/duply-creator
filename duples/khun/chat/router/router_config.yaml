# router_config.yaml — Khun (SET market finance)

# SET market — DR tickers append digits e.g. NUARA23 (7 chars), allow up to 10
ticker_regex: "^[A-Z][A-Z0-9.]{0,9}$"

ticker_alias_map: {}

chat_word_denylist:
  - HI
  - HEY
  - OK
  - "NO"
  - "YES"
  - WOW
  - LOL
  - THANKS
  - TEST
  - KHUN

# ─── SERVICE ROUTES ────────────────────────────────────────────────────────────
service_routes:
  - patterns: ["ADD "]
    match: prefix
    type: PROFILE_UPDATE
    op: add
    field: watchlist
    max: 5
    payload: rest_words

  - patterns: ["DEL "]
    match: prefix
    type: PROFILE_UPDATE
    op: remove
    field: watchlist
    max: 5
    payload: rest_words

  - patterns: ["TH", "EN", "TH LANG", "EN LANG"]
    match: exact
    type: LANG_UPDATE
    payload: self

# ─── POSTBACK ROUTES ───────────────────────────────────────────────────────────
postback_routes:
  - patterns: ["TAG|"]
    match: prefix
    card_type: tag_info
    payload: rest

# ─── CARD KEYWORD ROUTES ───────────────────────────────────────────────────────
mode_words:
  pt: [pt, price, technical]

keyword_route_map: {}
